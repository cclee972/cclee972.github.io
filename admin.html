<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CC Lee 管理後台</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:system-ui,sans-serif; background:#f5f5f5; color:#333; padding:24px; }
    h1 { font-size:1.3rem; margin-bottom:6px; }
    .sub { color:#888; font-size:.85rem; margin-bottom:24px; }
    .card { background:#fff; border:1px solid #e0e0e0; border-radius:10px; padding:24px; margin-bottom:20px; }
    input[type="password"] { width:100%; padding:9px 12px; border:1px solid #ccc; border-radius:6px; font:inherit; font-size:.95rem; margin-bottom:12px; }
    .btn { padding:9px 20px; border:none; border-radius:6px; cursor:pointer; font:inherit; font-size:.9rem; }
    .btn-primary { background:#2563eb; color:#fff; }
    .btn-sm { padding:5px 12px; font-size:.82rem; border-radius:5px; border:none; cursor:pointer; }
    .btn-approve { background:#16a34a; color:#fff; }
    .btn-deny { background:#dc2626; color:#fff; }
    .btn-logout { background:#f3f4f6; border:1px solid #ddd; color:#555; float:right; }
    .msg { padding:8px 12px; border-radius:6px; margin-top:10px; font-size:.88rem; display:none; }
    .msg.ok { background:#d1fae5; color:#065f46; display:block; }
    .msg.err { background:#fee2e2; color:#991b1b; display:block; }
    table { width:100%; border-collapse:collapse; }
    th { text-align:left; padding:10px 12px; background:#f8f8f8; border-bottom:2px solid #e0e0e0; font-size:.85rem; color:#666; }
    td { padding:12px; border-bottom:1px solid #f0f0f0; font-size:.9rem; vertical-align:middle; }
    tr:last-child td { border-bottom:none; }
    .email-cell { font-weight:600; }
    .time-cell { color:#999; font-size:.82rem; }
    .badge { display:inline-block; padding:3px 9px; border-radius:999px; font-size:.75rem; font-weight:600; }
    .badge-pending { background:#fef3c7; color:#92400e; }
    .badge-approved { background:#d1fae5; color:#065f46; }
    .empty { color:#999; text-align:center; padding:32px; font-size:.9rem; }
    .actions { display:flex; gap:8px; align-items:center; }
    input[type="checkbox"] { width:18px; height:18px; cursor:pointer; accent-color:#16a34a; }
    .refresh-note { color:#999; font-size:.8rem; margin-top:10px; }
    #login-section { max-width:380px; margin:60px auto; }
  </style>
</head>
<body>

<!-- 登入 -->
<div id="login-section" class="card">
  <h1>🔐 管理後台</h1>
  <p class="sub">CC Lee 專用</p>
  <input type="password" id="key-input" placeholder="管理員密鑰" autofocus />
  <button class="btn btn-primary" onclick="doLogin()">登入</button>
  <div class="msg" id="login-msg"></div>
</div>

<!-- 管理區 -->
<div id="admin-section" style="display:none; max-width:780px; margin:0 auto;">
  <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;">
    <h1>📋 存取請求管理</h1>
    <button class="btn btn-sm btn-logout" onclick="doLogout()">登出</button>
  </div>
  <p class="sub">勾選 Checkbox 即核准並自動寄送 OTP 驗證碼給客戶</p>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th style="width:36px;">允許</th>
          <th>Email</th>
          <th>請求時間</th>
          <th>狀態</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="req-list">
        <tr><td colspan="5" class="empty">載入中…</td></tr>
      </tbody>
    </table>
    <p class="refresh-note">⟳ 每 10 秒自動更新 · <a href="#" onclick="loadRequests();return false;" style="color:#2563eb;">立即重新整理</a></p>
  </div>
</div>

<script>
  const WORKER      = 'https://portfolio-auth.cc-lee972.workers.dev';
  const STORAGE_KEY = 'cc_admin_key';
  const EMAILJS_KEY = 'dv9nbeUX-hSd0zsIV';
  const SERVICE_ID  = 'portfolio_otp';
  const TEMPLATE_ID = 'template_fozs3ag';

  emailjs.init(EMAILJS_KEY);

  let adminKey = '';
  let pollTimer;

  function showMsg(id, text, type) {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = 'msg ' + type;
  }

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  function genOTP() {
    return String(Math.floor(100000 + Math.random() * 900000));
  }

  function timeAgo(ts) {
    const diff = Math.floor((Date.now() - ts) / 1000);
    if (diff < 60) return `${diff} 秒前`;
    if (diff < 3600) return `${Math.floor(diff/60)} 分鐘前`;
    return `${Math.floor(diff/3600)} 小時前`;
  }

  async function doLogin(key) {
    key = key || document.getElementById('key-input').value.trim();
    if (!key) return;
    const res = await fetch(`${WORKER}/admin/pending`, { headers: { 'X-Admin-Key': key } });
    if (res.ok) {
      adminKey = key;
      localStorage.setItem(STORAGE_KEY, key);
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('admin-section').style.display = 'block';
      loadRequests();
      pollTimer = setInterval(loadRequests, 10000);
    } else {
      localStorage.removeItem(STORAGE_KEY);
      showMsg('login-msg', '密鑰錯誤，請再試一次。', 'err');
    }
  }

  function doLogout() {
    clearInterval(pollTimer);
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  }

  async function loadRequests() {
    const res = await fetch(`${WORKER}/admin/pending`, { headers: { 'X-Admin-Key': adminKey } });
    if (!res.ok) return;
    const requests = await res.json();
    const tbody = document.getElementById('req-list');

    if (!requests.length) {
      tbody.innerHTML = '<tr><td colspan="5" class="empty">目前沒有待審請求</td></tr>';
      return;
    }

    tbody.innerHTML = requests.map(r => `
      <tr id="row-${btoa(r.email)}">
        <td><input type="checkbox" onchange="handleApprove(this, '${r.email}')" title="勾選以核准"></td>
        <td class="email-cell">${r.email}</td>
        <td class="time-cell">${timeAgo(r.timestamp)}</td>
        <td><span class="badge badge-pending">待審核</span></td>
        <td>
          <div class="actions">
            <button class="btn-sm btn-deny" onclick="denyRequest('${r.email}')">拒絕</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  async function handleApprove(checkbox, email) {
    checkbox.disabled = true;
    const row = document.getElementById(`row-${btoa(email)}`);
    row.querySelector('td:nth-child(4)').innerHTML = '<span class="badge" style="background:#dbeafe;color:#1e40af">寄送中…</span>';

    // 產生 OTP
    const otp = genOTP();
    const hash = await sha256(otp);

    // 用 EmailJS 寄 OTP 給客戶
    try {
      await emailjs.send(SERVICE_ID, TEMPLATE_ID, {
        to_email: email,
        passcode: otp,
        time: '10 分鐘',
        site_url: 'https://cclee972.github.io'
      });
    } catch (e) {
      row.querySelector('td:nth-child(4)').innerHTML = '<span class="badge" style="background:#fee2e2;color:#991b1b">寄送失敗</span>';
      checkbox.disabled = false;
      checkbox.checked = false;
      return;
    }

    // 通知 Worker 已核准
    await fetch(`${WORKER}/admin/approve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
      body: JSON.stringify({ email, otp_hash: hash })
    });

    row.querySelector('td:nth-child(4)').innerHTML = '<span class="badge badge-approved">✅ 已核准</span>';
    row.querySelector('td:nth-child(5)').innerHTML = '';
    row.querySelector('td:nth-child(1)').innerHTML = '✅';
    row.style.opacity = '0.6';

    // 30 秒後從清單移除
    setTimeout(() => row.remove(), 30000);
  }

  async function denyRequest(email) {
    if (!confirm(`確定要拒絕 ${email} 的請求嗎？`)) return;
    await fetch(`${WORKER}/admin/deny`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Key': adminKey },
      body: JSON.stringify({ email })
    });
    document.getElementById(`row-${btoa(email)}`)?.remove();
    if (!document.querySelector('#req-list tr:not(.empty-row)')) loadRequests();
  }

  // 頁面載入自動登入
  window.addEventListener('DOMContentLoaded', () => {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) doLogin(saved);
  });

  document.getElementById('key-input')?.addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
</script>
</body>
</html>
