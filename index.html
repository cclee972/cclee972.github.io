<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CC Lee — 請先登入</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; font-family: "Plus Jakarta Sans", system-ui, sans-serif; background: #0b0c1e; color: #f1f5f9; }

    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 60% 60% at 20% 30%, rgba(108,99,255,.2), transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 70%, rgba(6,182,212,.15), transparent 60%);
      pointer-events: none;
    }

    .page {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px; position: relative; z-index: 1;
    }

    .logo { font-size: 1.6rem; font-weight: 800; letter-spacing: -.03em; margin-bottom: 40px; color: #fff; }
    .logo span { color: #6c63ff; }

    .card {
      width: 100%; max-width: 400px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 24px; padding: 40px 36px;
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px rgba(0,0,0,.4);
    }
    .card-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 6px; }
    .card-sub { color: rgba(255,255,255,.45); font-size: .9rem; margin-bottom: 32px; }

    label { display: block; font-size: .82rem; font-weight: 600; color: rgba(255,255,255,.6); margin-bottom: 8px; letter-spacing: .04em; }

    .input-wrap { position: relative; margin-bottom: 20px; }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 13px 48px 13px 16px; border-radius: 12px;
      background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.12);
      color: #fff; font: inherit; font-size: .98rem; outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: rgba(255,255,255,.25); }
    input:focus { border-color: #6c63ff; box-shadow: 0 0 0 3px rgba(108,99,255,.2); }

    .toggle-pw {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,.4); font-size: 1rem; transition: color .2s; padding: 4px;
    }
    .toggle-pw:hover { color: rgba(255,255,255,.8); }

    .error {
      display: none; background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3); color: #fca5a5;
      border-radius: 10px; padding: 11px 14px;
      font-size: .86rem; margin-bottom: 20px;
    }
    .error.show { display: block; }

    .btn-login {
      width: 100%; padding: 14px; border-radius: 12px; border: none; cursor: pointer;
      font: inherit; font-size: .98rem; font-weight: 700;
      background: linear-gradient(135deg, #6c63ff, #06b6d4); color: #fff;
      box-shadow: 0 6px 24px rgba(108,99,255,.45);
      transition: transform .2s, box-shadow .2s, opacity .2s;
    }
    .btn-login:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(108,99,255,.55); }
    .btn-login:disabled { opacity: .5; cursor: not-allowed; transform: none; }

    .footer-note { margin-top: 32px; color: rgba(255,255,255,.2); font-size: .78rem; text-align: center; }
  </style>
</head>
<body>
  <div class="page">
    <div class="logo">CC<span>.</span></div>

    <div class="card">
      <div class="card-title">歡迎 👋</div>
      <div class="card-sub">請輸入密碼以瀏覽作品集</div>

      <form id="login-form" autocomplete="off" novalidate>
        <label for="pw">密碼</label>
        <div class="input-wrap">
          <input type="password" id="pw" placeholder="輸入密碼…" autofocus />
          <button type="button" class="toggle-pw" id="toggle-pw" aria-label="顯示/隱藏密碼">👁</button>
        </div>
        <div class="error" id="error-msg">密碼錯誤，請再試一次。</div>
        <button type="submit" class="btn-login" id="login-btn">進入作品集</button>
      </form>
    </div>

    <p class="footer-note">© 2026 CC Lee · 僅供受邀者瀏覽</p>
  </div>

  <script>
    const HASH = '6d9a4aa71931b78d95eced48f89572a9a3e8f83b8b0a62ca77dd7efce498efaf';

    if (sessionStorage.getItem('cc_auth') === 'ok') {
      window.location.replace('./portfolio.html');
    }

    const pwInput = document.getElementById('pw');
    document.getElementById('toggle-pw').addEventListener('click', () => {
      pwInput.type = pwInput.type === 'password' ? 'text' : 'password';
    });

    document.getElementById('login-form').addEventListener('submit', async e => {
      e.preventDefault();
      const pw = pwInput.value;
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('error-msg');
      if (!pw) return;
      btn.disabled = true; btn.textContent = '驗證中…'; errEl.classList.remove('show');
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
      const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
      if (hex === HASH) {
        sessionStorage.setItem('cc_auth', 'ok');
        window.location.replace('./portfolio.html');
      } else {
        errEl.classList.add('show');
        pwInput.value = ''; pwInput.focus();
        btn.disabled = false; btn.textContent = '進入作品集';
      }
    });
  </script>
</body>
</html>
