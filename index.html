<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CC Lee — 請先登入</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html, body { height:100%; font-family:"Plus Jakarta Sans",system-ui,sans-serif; background:#0b0c1e; color:#f1f5f9; }
    body::before {
      content:""; position:fixed; inset:0; z-index:0;
      background:
        radial-gradient(ellipse 60% 60% at 20% 30%, rgba(108,99,255,.2), transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 70%, rgba(6,182,212,.15), transparent 60%);
      pointer-events:none;
    }
    .page { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; position:relative; z-index:1; }
    .logo { font-size:1.6rem; font-weight:800; letter-spacing:-.03em; margin-bottom:40px; color:#fff; }
    .logo span { color:#6c63ff; }
    .card { width:100%; max-width:420px; background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1); border-radius:24px; padding:40px 36px; backdrop-filter:blur(16px); box-shadow:0 24px 60px rgba(0,0,0,.4); }
    .card-title { font-size:1.4rem; font-weight:700; margin-bottom:6px; }
    .card-sub { color:rgba(255,255,255,.45); font-size:.9rem; margin-bottom:28px; }
    label { display:block; font-size:.82rem; font-weight:600; color:rgba(255,255,255,.6); margin-bottom:8px; }
    .input-wrap { margin-bottom:20px; }
    input { width:100%; padding:13px 16px; border-radius:12px; background:rgba(255,255,255,.06); border:1.5px solid rgba(255,255,255,.12); color:#fff; font:inherit; font-size:.98rem; outline:none; transition:border-color .2s, box-shadow .2s; }
    input::placeholder { color:rgba(255,255,255,.25); }
    input:focus { border-color:#6c63ff; box-shadow:0 0 0 3px rgba(108,99,255,.2); }
    .error { display:none; background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.3); color:#fca5a5; border-radius:10px; padding:11px 14px; font-size:.86rem; margin-bottom:16px; }
    .error.show { display:block; }
    .btn { width:100%; padding:14px; border-radius:12px; border:none; cursor:pointer; font:inherit; font-size:.98rem; font-weight:700; background:linear-gradient(135deg,#6c63ff,#06b6d4); color:#fff; box-shadow:0 6px 24px rgba(108,99,255,.45); transition:transform .2s, box-shadow .2s, opacity .2s; }
    .btn:hover { transform:translateY(-2px); box-shadow:0 10px 32px rgba(108,99,255,.55); }
    .btn:disabled { opacity:.5; cursor:not-allowed; transform:none; }
    .waiting-icon { font-size:2.5rem; margin-bottom:16px; animation: spin 2s linear infinite; display:inline-block; }
    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .waiting-email { font-weight:700; color:#a5b4fc; word-break:break-all; }
    .back-link { display:block; text-align:center; margin-top:16px; color:rgba(255,255,255,.35); font-size:.85rem; cursor:pointer; }
    .back-link:hover { color:rgba(255,255,255,.65); }
    .footer-note { margin-top:32px; color:rgba(255,255,255,.2); font-size:.78rem; text-align:center; }
  </style>
</head>
<body>
<div class="page">
  <div class="logo">CC<span>.</span></div>

  <!-- Step 1: 輸入 Email -->
  <div class="card" id="step-email">
    <div class="card-title">歡迎 👋</div>
    <div class="card-sub">請輸入你的 Email 申請存取，管理員核准後將寄送驗證碼給你</div>
    <div class="input-wrap">
      <label for="email-input">Email</label>
      <input type="email" id="email-input" placeholder="your@email.com" autofocus />
    </div>
    <div class="error" id="email-error"></div>
    <button class="btn" id="submit-btn" onclick="submitEmail()">申請存取</button>
  </div>

  <!-- Step 2: 等待核准 -->
  <div class="card" id="step-waiting" style="display:none; text-align:center;">
    <div class="waiting-icon">⏳</div>
    <div class="card-title">等待管理員核准</div>
    <div class="card-sub" style="margin-bottom:16px;">
      已收到來自 <span class="waiting-email" id="waiting-email"></span> 的請求<br>
      核准後驗證碼將自動寄至你的信箱
    </div>
    <div class="error" id="waiting-error"></div>
    <span class="back-link" onclick="goBack()">← 重新輸入 Email</span>
  </div>

  <!-- Step 3: 輸入 OTP -->
  <div class="card" id="step-otp" style="display:none;">
    <div class="card-title">輸入驗證碼 ✉️</div>
    <div class="card-sub">驗證碼已寄到你的信箱，10 分鐘內有效</div>
    <div class="input-wrap">
      <label for="otp-input">6 位數驗證碼</label>
      <input type="text" id="otp-input" placeholder="000000" maxlength="6" autocomplete="one-time-code" autofocus />
    </div>
    <div class="error" id="otp-error"></div>
    <button class="btn" id="verify-btn" onclick="verifyOTP()">驗證並進入</button>
    <span class="back-link" onclick="goBack()">← 重新輸入 Email</span>
  </div>

  <p class="footer-note">© 2026 CC Lee · 僅供受邀者瀏覽</p>
</div>

<script>
  const WORKER        = 'https://portfolio-auth.cc-lee972.workers.dev';
  if (sessionStorage.getItem('cc_auth') === 'ok') {
    window.location.replace('./portfolio.html');
  }

  let currentEmail = '';
  let pollTimer = null;

  // 從 OTP 信件連結進來（?e=email）→ 自動跳到正確步驟
  window.addEventListener('DOMContentLoaded', async () => {
    const params = new URLSearchParams(location.search);
    const emailFromLink = params.get('e');
    if (!emailFromLink) return;

    currentEmail = emailFromLink.toLowerCase();
    try {
      const res = await fetch(`${WORKER}/status?e=${encodeURIComponent(currentEmail)}`);
      const data = await res.json();
      if (data.status === 'approved') {
        // 直接顯示 OTP 輸入框
        document.getElementById('step-email').style.display = 'none';
        document.getElementById('step-otp').style.display = 'block';
        document.getElementById('otp-input').focus();
      } else if (data.status === 'pending') {
        // 顯示等待畫面並繼續 polling
        document.getElementById('waiting-email').textContent = currentEmail;
        document.getElementById('step-email').style.display = 'none';
        document.getElementById('step-waiting').style.display = 'block';
        startPolling();
      }
    } catch { /* 網路問題，保持預設畫面 */ }
  });

  function setErr(id, msg) {
    const el = document.getElementById(id);
    el.textContent = msg;
    el.classList.toggle('show', !!msg);
  }

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  // Step 1: 提交 Email
  async function submitEmail() {
    const email = document.getElementById('email-input').value.trim().toLowerCase();
    setErr('email-error', '');
    if (!email || !/^[^\s@]+@[^\s@]+\.[a-zA-Z]{2,}$/.test(email)) {
      setErr('email-error', '請輸入有效的 Email 地址。');
      return;
    }
    const btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = '送出中…';

    try {
      const res = await fetch(`${WORKER}/request`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json();
      if (!data.ok) throw new Error();
    } catch {
      setErr('email-error', '送出失敗，請稍後再試。');
      btn.disabled = false; btn.textContent = '申請存取';
      return;
    }

    currentEmail = email;
    document.getElementById('waiting-email').textContent = email;
    document.getElementById('step-email').style.display = 'none';
    document.getElementById('step-waiting').style.display = 'block';
    btn.disabled = false; btn.textContent = '申請存取';
    startPolling();
  }

  // 輪詢狀態
  function startPolling() {
    pollTimer = setInterval(async () => {
      try {
        const res = await fetch(`${WORKER}/status?e=${encodeURIComponent(currentEmail)}`);
        const data = await res.json();
        if (data.status === 'approved') {
          clearInterval(pollTimer);
          document.getElementById('step-waiting').style.display = 'none';
          document.getElementById('step-otp').style.display = 'block';
          document.getElementById('otp-input').focus();
        } else if (data.status === 'expired') {
          clearInterval(pollTimer);
          setErr('waiting-error', '請求已過期（30 分鐘），請重新申請。');
        }
      } catch { /* 網路暫時問題，下次再試 */ }
    }, 5000);
  }

  // Step 3: 驗證 OTP
  async function verifyOTP() {
    const input = document.getElementById('otp-input').value.trim();
    setErr('otp-error', '');
    if (!input || input.length !== 6) {
      setErr('otp-error', '請輸入 6 位數驗證碼。');
      return;
    }
    const btn = document.getElementById('verify-btn');
    btn.disabled = true; btn.textContent = '驗證中…';

    const hash = await sha256(input);
    try {
      const res = await fetch(`${WORKER}/verify`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: currentEmail, otp_hash: hash })
      });
      const data = await res.json();
      if (data.ok) {
        sessionStorage.setItem('cc_auth', 'ok');
        window.location.replace('./portfolio.html');
      } else if (data.error === 'otp_expired') {
        setErr('otp-error', '驗證碼已過期，請聯絡管理員重新核准。');
      } else {
        setErr('otp-error', '驗證碼錯誤，請再試一次。');
      }
    } catch {
      setErr('otp-error', '網路錯誤，請稍後再試。');
    }
    btn.disabled = false; btn.textContent = '驗證並進入';
  }

  function goBack() {
    clearInterval(pollTimer);
    currentEmail = '';
    setErr('email-error', '');
    setErr('waiting-error', '');
    setErr('otp-error', '');
    document.getElementById('otp-input').value = '';
    document.getElementById('step-waiting').style.display = 'none';
    document.getElementById('step-otp').style.display = 'none';
    document.getElementById('step-email').style.display = 'block';
    document.getElementById('email-input').focus();
  }

  document.getElementById('email-input').addEventListener('keydown', e => { if (e.key === 'Enter') submitEmail(); });
  document.getElementById('otp-input').addEventListener('keydown', e => { if (e.key === 'Enter') verifyOTP(); });
  document.getElementById('otp-input').addEventListener('input', e => {
    e.target.value = e.target.value.replace(/\D/g, '');
  });
</script>
</body>
</html>
